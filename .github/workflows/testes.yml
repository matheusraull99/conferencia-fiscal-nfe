name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Testes (pytest)
        run: pytest -q
      - name: Conferência de ponta a ponta no lote de exemplo
        run: nfe-conf conferir --xml exemplos/xml --erp exemplos/erp_lancamentos.csv --saida saida/relatorio.xlsx
