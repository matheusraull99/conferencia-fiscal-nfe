[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "conferencia-fiscal-nfe"
version = "0.1.0"
description = "Robô de conferência fiscal de entrada: valida XMLs de NF-e, recalcula impostos e cruza com o ERP."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Matheus Raul" }]
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
nfe-conf = "nfe_conf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nfe_conf = ["referencias/*.csv", "sql/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
